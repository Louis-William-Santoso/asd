version: '3.8'

services:
  fog_mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fog_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  fog_edge_agent:
    build: ./edge-agent
    container_name: fog_edge_agent
    restart: unless-stopped
    depends_on:
      - fog_mosquitto
    environment:
      - LOCAL_BROKER=fog_mosquitto
      - CLOUD_BROKER=fog_mosquitto
    volumes:
      - ./edge-agent/data:/app/data
